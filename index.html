rvSec("🚫 Errores comunes y lista de revisión <i>(Common mistakes and checklist)</i>",rvErr("Error 1 · he / she / it","Elena *have* won a trophy.","Elena *has* won a trophy.","With he / she / it we use has.","Con he / she / it usamos has.")+rvErr("Error 2 · participle","I have *went* to the beach.","I have *been* to the beach.","Use the past participle, not the simple past.","Usa el participio pasado, no el pasado simple.")+rvErr("Error 3 · question","*Have* she ever flown a kite?","*Has* she ever flown a kite?","Questions with he / she / it start with Has.","Las preguntas con he / she / it empiezan con Has.")+rvErr("Error 4 · exact time","We have bought this house *in 2018*.","We bought this house in 2018.","Do not use a finished time with present perfect.","No uses un tiempo terminado con presente perfecto.")+rvErr("Error 5 · double negative","I *haven't never* ridden a camel.","I have *never* ridden a camel.","Never is already negative: do not add haven't.","Never ya es negativo: no agregues haven't.")+rvErr("Error 6 · base form","Pablo has *eat* the whole pizza.","Pablo has *eaten* the whole pizza.","After have / has we use the participle, not the base form.","Después de have / has usamos el participio, no la forma base.")+rvErr("Error 7 · wh question","What *has* your friends cooked?","What *have* your friends cooked?","With plural subjects we use have, also in wh questions.","Con sujetos plurales usamos have, también en las wh questions.")+rvCheck([["¿have o has?","have or has?"],["¿Participio irregular?","Irregular participle?"],["Negativa: haven't / hasn't / never","Negative"],["Pregunta: Have / Has + sujeto + ever…?","Question"],["Sin tiempo exacto","No exact time"]])+rvQ("Find the error: 'They has watched a play.'","Encuentra el error: 'They has watched a play.'",["They","has","a play"],1,"They → have. · They → have."));

rvSec("🔁 must vs have to · pasado <i>(must vs have to · past)</i>",rvL("En el inglés de todos los días se usa mucho *have to* en lugar de *must*. *Must* suena más fuerte y formal (reglas, letreros, leyes); *have to* es la forma natural en una conversación.","In everyday English we often say have to instead of must. Must sounds stronger and more formal.")+rvTb(["","must","have to"],[["I / you / we / they","You <b>must</b> show your ID.","You <b>have to</b> show your ID."],["He / she / it","She <b>must</b> sign the form.<br><i>(sin -s · no -s)</i>","She <b>has to</b> sign the form.<br><i>(¡cambia a has! · it changes to has!)</i>"],["Question · Pregunta","<b>Must</b> I wait here?<br><i>(formal, rara · formal, rare)</i>","<b>Do</b> I <b>have to</b> wait here?<br><i>(natural)</i>"],["Negative · Negativa","You <b>mustn't</b> touch it.<br><i>prohibido · forbidden</i>","You <b>don't have to</b> touch it.<br><i>no es necesario · not necessary</i>"],["Past · Pasado","—","You <b>had to</b> take a test."]])+rvTip("<b>Have to no es un modal</b>: usa *do / does* en preguntas y negativas, y *has to* con he / she / it.","Have to is not a modal: it uses do / does in questions and negatives, and has to with he / she / it.")+rvEx("*Do* we *have to* bring a notebook?","¿Tenemos que traer un cuaderno?","qs")+rvEx("He *has to* take two buses to school.","Él tiene que tomar dos buses para ir al colegio.")+rvTip("Un nombre singular (Camila, my sister) se usa como he / she → *has to*; un plural (my parents) como they → *have to*.","A singular noun takes has to; a plural noun takes have to.")+rvL("⏪ <b>Pasado</b>","Past")+rvTip("*Must no tiene pasado*. Usa *had to*.","Must has no past form. Use had to.","w")+rvEx("Last week we *had to* write an essay.  (not \"we musted\")","La semana pasada tuvimos que escribir un ensayo.")+rvL("Con estas expresiones de tiempo pasado usamos *had to*:","Use had to with these past time expressions:")+rvChips(["Yesterday (ayer)","Last week (la semana pasada)"," rvSec("⚠️ had better <i>(had better)</i>",rvL("Usa *had better* para consejos urgentes o advertencias: si no lo haces, pasará algo malo.","Use had better for urgent advice or a warning: if you don't do it, something bad will happen.")+`<div class="hb2"><span class="rbp rb-s">You'd better hurry</span><b>➜</b><span class="rbp rb-e">or you'll miss the bus</span><small>Acción urgente ➜ consecuencia negativa · Urgent action ➜ bad consequence</small></div>`+rvEx("You *had better* save your work, or you will lose it.","Más te vale guardar tu trabajo, o lo perderás.")+rvEx("You*'d better* listen carefully.","Más te vale escuchar con atención.")+rvEx("You *had better not* forget the keys.","Más te vale no olvidar las llaves.","no")+rvL("🧠 <b>Características especiales</b>","Special features")+rvEx("Parece pasado, pero significa *presente o futuro*.","Looks like past, but it means present or future.","ok")+rvEx("*'d = had* (not \"would\"): You'd better go.","'d = had (no \"would\"): You'd better go.","ok")+rvEx("❌ had better *to* go → ✅ had better go","❌ had better to go → ✅ had better go","no")+rvPk("⚡ Warning generator · Generador de advertencias",[["⏰ Alarm",rvEx("You'*d better* set an alarm, or you'll oversleep.","Más te vale poner una alarma, o te quedarás dormido.")],["📝 Exam",rvEx("You'*d better* study, or you'll fail the exam.","Más te vale estudiar, o reprobarás el examen.")],["🌧️ Rain",rvEx("You'*d better* take an umbrella, or you'll get wet.","Más te vale llevar paraguas, o te mojarás.")],["🔥 Fire",rvEx("You'*d better not* touch that, or you'll get burned.","Más te vale no tocar eso, o te quemarás.","no")]])+rvTip("Usa *should* para consejos generales y *had better* cuando hay un riesgo claro.","Use should for general advice and had better when there is a clear risk.")+rvQ("Complete: You ___ hurry, or you'll miss the bus.","Completa: ___ apurarte, o perderás el bus.",["had better to","had better","had better not"],1,"had better + base verb (no to). · had better + v rvSec("⚖️ Compáralos: ¿cuál modal? <i>(Compare them: which modal?)</i>",rvTb(["Modal","Strength · Fuerza","Use · Uso"],[["should","<span class='mtr'>▮▯▯▯▯</span>","Friendly advice · Consejo amistoso"],["ought to","<span class='mtr'>▮▮▯▯▯</span>","Moral duty, formal · Deber moral, formal"],["had better","<span class='mtr'>▮▮▮▯▯</span>","Warning, risk · Advertencia, riesgo"],["have to","<span class='mtr'>▮▮▮▮▯</span>","Everyday obligation · Obligación cotidiana"],["must","<span class='mtr'>▮▮▮▮▮</span>","Rules and laws · Reglas y leyes"]])+rvL("🩺 <b>Misma situación, cinco voces</b>","Same situation, five voices")+rvEx("You *should* see a doctor.","Deberías ir al médico.")+rvEx("You *ought to* see a doctor.","Deberías ir al médico (es tu deber).")+rvEx("You*'d better* see a doctor, or it will get worse.","Más te vale ir al médico, o empeorará.")+rvEx("You *have to* see a doctor. The school requires it.","Tienes que ir al médico. El colegio lo exige.")+rvEx("You *must* see a doctor. The school requires it.","Debes ir al médico. El colegio lo exige.")+rvPk("🧭 Which modal? · ¿Cuál modal?",[["📜 Rule or law",rvEx("There is a rule → *must / mustn't*","Hay una regla → must / mustn't")],["🗓️ Everyday duty",rvEx("Something you need to do in daily life → *have to / has to*","Algo que tienes que hacer en la vida diaria → have to / has to")],["💬 Friendly advice",rvEx("Friendly suggestion → *should*","Sugerencia amistosa → should")],["❤️ Moral duty",rvEx("Right thing to do → *ought to*","Lo correcto → ought to")],["⚠️ Bad consequence",rvEx("Risk if you don't → *had better*","Riesgo si no lo haces → had better")],["📵 Forbidden",rvEx("Not allowed → *mustn't*","No está permitido → mustn't")],["🆓 Not necessary",rvEx("You can choose → *don't / doesn't have to*","Puedes elegir → don't / doesn't have to")]])+rvQ("The sign says: \"Visitors ___ feed the animals.\"","El letrero dice: \"Los visitantes ___ alimentar a los animales.\"",["must","mustn't","don't have to"],1,"A sign that forbids → rvSec("❓ Negativas, preguntas y respuestas cortas <i>(Negatives, questions and short answers)</i>",rvTb(["Modal","Negative · Negativa","Question · Pregunta"],[["<b>must</b>","mustn't","Must I…? (formal, rare · formal, rara)<br>Natural: <b>Do I have to…?</b>"],["<b>should</b>","shouldn't","Should I…?"],["<b>ought to</b>","ought not to","Ought I to…? (rare · rara)"],["<b>had better</b>","had better not","(rare · rara)"],["<b>have to</b>","don't / doesn't have to","Do / Does … have to…?"]])+rvTip("Los modales *NO* usan do / does: se cambia el orden. (*Have to* no es un modal, por eso sí usa do / does.)","Modals do NOT use do / does: we change the order. (Have to is not a modal, so it does use do / does.)")+rvEx("✅ *Should* I open the window?  ·  ❌ Do I should open the window?","✅ ¿Debería abrir la ventana?","ok")+rvFm("*Wh word* + *should* + subject + base verb + ?","Palabra interrogativa + should + sujeto + verbo base","qq")+rvEx("What *should* I do?","¿Qué debería hacer?","qs")+rvEx("Where *should* we go?","¿Adónde deberíamos ir?","qs")+rvEx("Who *should* I ask?","¿A quién debería preguntarle?","qs")+rvEx("How *should* she answer?","¿Cómo debería responder ella?","qs")+rvEx("When *should* they leave?","¿Cuándo deberían irse?","qs")+rvEx("What *should* he say?","¿Qué debería decir él?","qs")+rvTb(["Question","Short answer · Respuesta corta"],[["Should I bring a jacket?","Yes, you should. · No, you shouldn't."],["Do we have to bring a notebook?","Yes, you do. · No, you don't."],["Does she have to wear a uniform?","Yes, she does. · No, she doesn't."]])+rvPk("🔄 Sentence switcher · Cambiador de oraciones",[["must",rvEx("✅ You *must* follow the rules.","Debes seguir las reglas.")+rvEx("➖ You *mustn't* break them.","No debes romperlas.","no")+rvEx("❓ *Do* I *have to* follow the rules? (natural)","¿Tengo que seguir las reglas?","qs")+rvEx("❓ *Must* I follow the rules? (formal, rare)","¿Debo seguir las reglas? (formal, poco usual)","qs")],["should",rvEx("✅ You *should* ask questions.","Deberías hacer preguntas.")+rvEx("➖ You *shouldn't* skip class.","No deberías faltar a clase.","no")+rvEx("❓ *Should* I ask questions?","¿Debería hacer preguntas?","qs")],["ought to",rvEx("✅ You *ought to* apologize.","Deberías disculparte.")+rvEx("➖ You *ought not to* shout.","No deberías gritar.","no")+rvEx("❓ *Ought* I *to* apologize?","¿Debería disculparme?","qs")],["had better",rvEx("✅ You *had better* go now.","Más te vale irte ya.")+rvEx("➖ You *had better not* go alone.","Más te vale no ir solo.","no")+rvEx("❓ *Should* I go now? (natural)","¿Debería irme ya? (natural)","qs")]])+rvQ("Which question is correct?","¿Cuál pregunta es correcta?",["Should I call him?","Do I should call him?","Should I to call him?"],0,"Modals: change the order, no do / does, no to. · Modales: cambia el orden, sin do / does ni to."))+

rvSec("🇪🇸↔🇬🇧 Traducción de los modales <i>(Translating modals)</i>",rvL("Cada modal en inglés tiene su equivalente en español. Fíjate en la *persona* (yo, tú, él / ella, nosotros, ellos):","Each English modal has a Spanish equivalent. Look at the person (I, you, he / she, we, they):")+rvModES()+rvTb(["Subject","Español"],[["I","Yo"],["you","Tú"],["he","Él"],["she","Ella"],["we","Nosotros"],["they","Ellos"]])+rvEx("You *must* wear a helmet.  =  Tú debes usar casco.","must → debes")+rvEx("He *has to* get up early.  =  Él tiene que levantarse temprano.","has to → tiene que")+rvEx("We *shouldn't* skip breakfast.  =  No deberíamos saltarnos el desayuno.","shouldn't → no deberíamos")+rvEx("You*'d better* study.  =  Más te vale estudiar.","had better → más te vale")+rvTip("Los modales en español van seguidos del *infinitivo* (debes usar); en inglés van seguidos del *verbo base* (must wear).","In Spanish modals are followed by the infinitive; in English by the base verb.")+rvQ("'Ella no debe fumar aquí.' → ?","Elige la oración en inglés.",["She mustn't smoke here.","She doesn't have to smoke here.","She shouldn't smoke here."],0,"no debe = mustn't (prohibido). · no debe = mustn't (prohibido).")+rvQ("'Más nos vale irnos ya.' → ?","Elige la oración en inglés.",["We should leave now.","We had better leave now.","We have to leave now."],1,"más nos vale = had better. · más nos vale = had better."))+

rvSec("🚫 Errores comunes y lista de revisión <i>(Common mistakes and checklist)</i>",rvErr("Error 1 · Modal + to","You should *to* study.","You should study.","After should, must and had better we don't use to.","Después de should, must y had better no se usa to.")+rvErr("Error 2 · Adding -s","She *musts* arrive early.","She must arrive early.","Modals never change with he / she / it.","Los modales nunca cambian con he / she / it.")+rvErr("Error 3 · Had better to","You had better *to* hurry.","You had better hurry.","Had better goes with the base verb, no to.","Had better va con verbo base, sin to.")+rvErr("Error 4 · Ought without to","You *ought* go now.","You ought *to* go now.","Ought ALWAYS takes to. Negative: ought not to.","Ought SIEMPRE lleva to. Negativo: ought not to.")+rvErr("Error 5 · Using do","*Do* I should call him?","*Should* I call him?","Modals don't use do/does; we change the order.","Los modales no usan do/does; se cambia el orden.")+rvErr("Error 6 · Modal + -ing","He shouldn't *going* out.","He shouldn't *go* out.","After a modal we use the base verb, never -ing.","Después de un modal va el verbo base, nunca -ing.")+rvErr("Error 7 · Past of must","I *musted* study yesterday.","I *had to* study yesterday.","Must has no past. Use had to.","Must no tiene pasado. Usa had to.")+rvErr("Error 8 · Have to with she / he / it","She *have to* wear a uniform.","She *has to* wear a uniform.","With he / she / it we use has to (has is the -s form of have).","Con he / she / it se usa has to (has es la forma con -s de have).")+rvErr("Error 9 · Does + has to","Does she *has to* go?","Does she *have to* go?","After do / does the verb goes back to the base form: have to.","Después de do / does el verbo vuelve a la forma base: have to.")+rvErr("Error 10 · mustn't vs don't have to","Tomorrow is a holiday. We *mustn't* go to school.","Tomorrow is a holiday. We *don't have to* go to school.","Mustn't = forbidden. Don't have to = not necessary.","Mustn't = prohibido. Don
